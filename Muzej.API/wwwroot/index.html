<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muzej - Prijava</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>MUZEJ<span>.</span></h1>
        <nav>
            <a href="katalog.html">Katalog</a>
        </nav>
    </header>

    <main>
        <div id="login-panel">
            <h2>Prijava</h2>
            <form id="login-form">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required>

                <label for="login-password">Lozinka</label>
                <input type="password" id="login-password" required>

                <button type="submit">Prijavi se</button>
                <div id="login-message"></div>
            </form>
            <p class="switch-text">Nemate nalog? <a href="#" id="idi-na-registraciju">Registrujte se</a></p>
        </div>

        <div id="register-panel" style="display: none;">
            <h2>Registracija</h2>
            <form id="register-form">
                <label for="reg-ime">Ime</label>
                <input type="text" id="reg-ime" required>

                <label for="reg-prezime">Prezime</label>
                <input type="text" id="reg-prezime" required>

                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" required>

                <label for="reg-password">Lozinka</label>
                <input type="password" id="reg-password" required minlength="5">

                <label for="reg-tip">Tip posetioca</label>
                <select id="reg-tip">
                    <option value="0">Redovan</option>
                    <option value="1">Student</option>
                    <option value="2">Penzioner</option>
                </select>

                <button type="submit">Registruj se</button>
                <div id="register-message"></div>
            </form>
            <p class="switch-text">Imate nalog? <a href="#" id="idi-na-prijavu">Prijavite se</a></p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
